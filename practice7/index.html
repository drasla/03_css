<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://kit.fontawesome.com/6fda4bf8e6.js" crossorigin="anonymous"></script>
</head>
<body>
<aside>
    <div class="logo">
        <i class="fa-solid fa-cube brand-icon"></i>
        <span>MyDash</span>
    </div>
    <nav>
        <ul>
            <li class="active">
                <i class="fa-regular fa-id-badge"></i>
                <span>Profile Info</span>
            </li>
            <li>
                <i class="fa-solid fa-shield-halved"></i>
                <span>Account Security</span>
            </li>
            <li>
                <i class="fa-regular fa-bell"></i>
                <span>Notifications</span>
            </li>
            <li>
                <i class="fa-solid fa-credit-card"></i>
                <span>Billing Details</span>
            </li>
        </ul>
    </nav>
</aside>
<main>
    <header>
        <div class="header-text">
            <h2>Profile Information</h2>
            <span>Update your photo and personal details.</span>
        </div>
        <div class="user-shortcut">
            <i class="fa-solid fa-magnifying-glass"></i>
            <div class="user-avatar-small">A</div>
        </div>
    </header>
    <div class="content-wrapper">
        <div class="profile-form">
            <div class="avatar-section">
                <div class="avatar-circle">A</div>
                <button class="btn btn-primary">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    Upload
                </button>
                <button class="btn btn-outline">
                    <i class="fa-solid fa-trash-can"></i>
                    Remove
                </button>
            </div>
            <div class="form">
                <div class="form-row">
                    <div class="input-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" class="form-input" />
                    </div>
                    <div class="input-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" class="form-input" />
                    </div>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="text" id="email" class="form-input" placeholder="abc@fsdaf.com" />
                </div>
                <div class="input-group">
                    <label for="phoneNumber">Phone Number</label>
                    <input type="tel" id="phoneNumber" class="form-input" />
                </div>
                <div>
                    <!--
                          checkbox를 사용하되, 그 모양을 보여주고 싶지 않다면?
                          checkbox에게 display: none을 부여함
                    -->
                    <label class="checkbox-wrapper">
                        <input type="checkbox" class="hidden-checkbox" />
                        <div class="checkbox-box">
                            <div class="checkmark-icon"></div>
                        </div>
                        Receive updates and newsletters via email
                    </label>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-outline">Cancel</button>
                <button class="btn btn-primary">Save Changes</button>
            </div>
        </div>
    </div>
</main>
</body>
</html>
