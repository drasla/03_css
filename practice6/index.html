<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="list-container">
        <div class="list-header">
            <div class="header-title">
                <h2>Device Management</h2>
                <span class="device-count">Total 4 Devices</span>
            </div>
            <button class="btn-add">+ Add Device</button>
        </div>
        <table class="data-table">

            <tr>
                <th>DEVICE NAME</th>

                <th>BATTERY</th>
                <th>ACTIONS</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>
                    <div class="device-info">
                        <div class="icon-box icon-light"></div>
                        <span class="device-name">Smart Bulb A</span>
                    </div>
                </td>
                <td>Living Room</td>
                <td>
                    <div class="status-badge badge-online">
                        <div class="status-dot"></div>
                        <span>Online</span>
                    </div>
                </td>
                <td>
                    <div class="battery-wrapper">
                        <div class="battery-bar">
                            <div class="battery-fill" style="width: 85%"></div>
                        </div>
                        <span class="battery-text">85%</span>
                    </div>
                </td>
                <td>
                    <button class="btn-edit">Edit</button>

            </tr>
